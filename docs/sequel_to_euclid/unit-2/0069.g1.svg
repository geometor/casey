      <path class="geom-line cross-line" d="M 173.8 466 L 294.34 240 L 414.87 14" data-ref="[ U2 V2 ]" fill="none"><title>[ U2 V2 ]: -360*sqrt(154)*x/289 + 192*sqrt(154)*y/289 + 1152*sqrt(154)/289 = 0</title></path>
