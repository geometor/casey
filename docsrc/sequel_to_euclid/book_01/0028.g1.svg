<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 480" width="680" height="480" data-graphic-id="0028.g1" role="img" aria-label="Casey Book I Prop. 1 — Diagonals of a Parallelogram Bisect Each Other">
  <title>Casey Book I Prop. 1 — Diagonals of a Parallelogram Bisect Each Other</title>
  <style>
:root {
