<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 480" width="680" height="480" data-graphic-id="0061.g1" role="img" aria-label="Casey Book III Prop. 12 — Simson&#x27;s Pedal Line (Collinearity of Feet D, F, E)">
