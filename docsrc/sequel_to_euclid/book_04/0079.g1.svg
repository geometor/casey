  .euclid-graphic .svg-bg { fill: #fafaf9; fill: var(--geom-bg); }
  .euclid-graphic .geom-circle { fill: none; stroke: #0369a1; stroke: var(--circle-base); stroke-width: 1.95; opacity: 0.9; transition: stroke 0.15s, stroke-width 0.15s; }
