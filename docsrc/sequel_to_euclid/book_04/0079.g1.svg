  .euclid-graphic .polar-line { stroke: #059669; stroke: var(--geom-assert); stroke-width: 2.4; }
  .euclid-graphic .symmedian-line { stroke: #db2777; stroke: var(--symmedian-line); stroke-width: 1.85; stroke-opacity: 0.86; }
