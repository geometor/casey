<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 480" width="680" height="480" data-graphic-id="0079.g1" role="img" aria-label="Casey Book IV Prop. 1 — Incircle Contact Segments s - a, s - b, s - c">
