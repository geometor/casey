<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 480" width="680" height="480" data-graphic-id="0035.g1" role="img" aria-label="Casey Book I Prop. 12 Cor. 1 — Concurrence of Circumcentre G, Centroid H &amp; Orthocentre I">
