<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 480" width="680" height="480" data-graphic-id="0093.g1" role="img" aria-label="Casey Book VI Prop. 2 — Ceva&#x27;s Theorem (BA&#x27;·CB&#x27;·AC&#x27; = A&#x27;C·B&#x27;A·C&#x27;B)">
  <title>Casey Book VI Prop. 2 — Ceva&#x27;s Theorem (BA&#x27;·CB&#x27;·AC&#x27; = A&#x27;C·B&#x27;A·C&#x27;B)</title>
  <style>
:root {
