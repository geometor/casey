    --geom-bg: #fafaf9;
    --geom-point-stroke: #fafaf9;
    --geom-poly-fill: #0284c7;
    --geom-accent: #d97706;
    --geom-assert: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --geom-fg: #e4e4e7;
      --geom-bg: #141417;
      --geom-point-stroke: #141417;
      --geom-poly-fill: #38bdf8;
      --geom-accent: #fbbf24;
      --geom-assert: #34d399;
    }
  }
  .euclid-graphic {
    --svg-bg: var(--geom-bg);
    --ink: var(--geom-fg);
    --label-halo: rgba(250, 250, 249, 0.92);
