      <circle class="geom-circle" cx="472.97" cy="240" r="58.24" data-ref="(O&#x27; P&#x27;)" data-aliases="( O&#x27; ) | ( O&#x27; P&#x27; )" fill="none"><title>(O&#x27; P&#x27;): y**2 + (x - 10)**2 - 9 = 0</title></circle>
      <path class="geom-line" d="M 14 240 L 340 240 L 666 240" data-ref="[O T]" data-aliases="[ O O&#x27; ] | / O O&#x27; / | [ O T ] | / O T / | [ O S ] | / O S / | [ O&#x27; T ] | / O&#x27; T / | [ O&#x27; S ] | / O&#x27; S / | [ T S ] | / T S /" fill="none"><title>[O T]: y = 0</title></path>
      <path class="geom-line" d="M 666 311.98 L 467.35 162.99 L 268.7 14" data-ref="[P P&#x27; T]" data-aliases="[ P P&#x27; ] | / P P&#x27; / | [ P T ] | / P T / | [ P&#x27; T ] | / P&#x27; T /" fill="none"><title>[P P&#x27; T]: 36*x/5 + 48*y/5 - 108 = 0</title></path>
      <path class="geom-line" d="M 109.35 466 L 278.85 240 L 448.35 14" data-ref="[O P]" data-aliases="[ O P ] | / O P /" fill="none"><title>[O P]: -36*x/5 + 27*y/5 = 0</title></path>
      <path class="geom-line" d="M 303.47 466 L 472.97 240 L 642.47 14" data-ref="[O&#x27; P&#x27;]" data-aliases="[ O&#x27; P&#x27; ] | / O&#x27; P&#x27; /" fill="none"><title>[O&#x27; P&#x27;]: -12*x/5 + 9*y/5 + 24 = 0</title></path>
  </g>
