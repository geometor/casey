      <circle class="geom-circle" cx="340" cy="150" r="77.14" data-ref="(Z E)" data-aliases="( Z ) | ( Z A ) | ( Z E )" fill="none"><title>(Z E): x**2 + (y - 5)**2 - 9 = 0</title></circle>
