    fill: var(--geom-fg);
    font-size: 13px;
    font-weight: 650;
    paint-order: stroke fill;
    stroke: #fafaf9;
    stroke: var(--label-halo);
    stroke-width: 3.5px;
    stroke-linejoin: round;
    user-select: none;
