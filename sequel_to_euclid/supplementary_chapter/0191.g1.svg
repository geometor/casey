    --polar-line: var(--geom-assert);
    --symmedian-line: #db2777;
    --tri-fill: var(--geom-poly-fill);
    --brocard-fill: #7c3aed;
    --pt-given: var(--geom-fg);
    --pt-center: #0369a1;
    --pt-highlight: var(--geom-accent);
    --pt-brocard: #7c3aed;
