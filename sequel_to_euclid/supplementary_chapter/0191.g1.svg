<svg xmlns="http://www.w3.org/2000/svg" class="euclid-graphic" viewBox="0 0 680 480" width="680" height="480" data-graphic-id="0191.g1" role="img" aria-label="Casey Supp. Ch. Sec. I Prop. 1 — Isogonal Conjugates P, Q &amp; Six-Point Pedal Circle">
