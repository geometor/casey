    background-color: var(--geom-bg);
  }
  @media (prefers-color-scheme: dark) {
    .euclid-graphic {
      --label-halo: rgba(20, 20, 23, 0.92);
      --carrier: #94a3b8;
      --circle-base: #38bdf8;
      --circle-featured: #fbbf24;
      --circle-secondary: #2dd4bf;
      --circle-orth: #c084fc;
      --circle-aux: #94a3b8;
      --symmedian-line: #f472b6;
      --brocard-fill: #c084fc;
      --pt-center: #38bdf8;
      --pt-brocard: #c084fc;
