    --geom-bg: #fafaf9;
    --geom-point-stroke: #fafaf9;
    --geom-poly-fill: #0284c7;
    --geom-accent: #d97706;
    --geom-assert: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --geom-fg: #e4e4e7;
      --geom-bg: #141417;
